<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shop</title>

<script src="https://kit.fontawesome.com/86b537907d.js" crossorigin="anonymous"></script>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shop.css">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="mobile.css">

</head>

<body>

<!-- NAVBAR -->
<header class="navbar">
  <div class="nav-top">
    <div class="logo">Petal & Bloom</div>

    <div class="search-bar">
      <input type="text" placeholder="Search..." />
      <i class="fas fa-search"></i>
    </div>

    <div class="nav-icons">
      <i class="fas fa-user"></i>
      <i class="fas fa-shopping-cart"></i>
      <span id="cart-count">0</span>
    </div>
  </div>

  <nav class="nav-bottom">
    <a href="#">Flowers</a>
    <a href="#">Gift Hampers</a>
    <a href="#">Her</a>
    <a href="#">Him</a>
  </nav>
</header>

<!-- SHOP -->
<section class="shop">
  <div class="shop-container">

    <!-- SIDEBAR -->
    <aside class="filters">
      <h3>Filter</h3>

      <!-- CATEGORY -->
      <div class="filter-group">
        <h4>Category</h4>

        <label>
          <input type="checkbox" class="category-filter" value="bouquet" onchange="filterProducts()">
          Flower Bouquet <span class="count" data-category="bouquet">0</span>
        </label>

        <label>
          <input type="checkbox" class="category-filter" value="basket" onchange="filterProducts()">
          Flower Basket <span class="count" data-category="basket">0</span>
        </label>

        <label>
          <input type="checkbox" class="category-filter" value="box" onchange="filterProducts()">
          Flower Box <span class="count" data-category="box">0</span>
        </label>
      </div>

      <!-- PRICE -->
      <div class="filter-group">
        <h4>Price</h4>
        <input type="range" id="priceRange" min="0" max="100" value="100" oninput="filterProducts()">
        <p>Max Price: $<span id="priceValue">100</span></p>
      </div>

      <!-- STOCK -->
      <div class="filter-group">
        <h4>Availability</h4>

        <label>
          <input type="checkbox" class="stock-filter" value="in" onchange="filterProducts()">
          In Stock
        </label>

        <label>
          <input type="checkbox" class="stock-filter" value="out" onchange="filterProducts()">
          Out of Stock
        </label>
      </div>
    </aside>

    <!-- PRODUCTS -->
    <div class="products">
      <h2>Products</h2>
      <div class="product-grid" id="productGrid"></div>
    </div>

  </div>
</section>

<!-- MODAL -->
<div class="modal" id="productModal">
  <div class="modal-content">

    <span class="close" onclick="closeModal()">&times;</span>

    <div class="modal-body">
      <div class="modal-img">
        <img id="modalImg">
      </div>

      <div class="modal-details">
        <h2 id="modalTitle"></h2>
        <p class="modal-desc"></p>
        <h3 class="modal-price"></h3>

        <button class="modal-add-btn" onclick="addToCart(this)">Add to Cart</button>
      </div>
    </div>

  </div>
</div>

<!-- JS -->
<script>

// PRODUCTS
const products = [
  { name: "Pink Tulip Bouquet", category: "bouquet", price: 40, stock: "in", image: "images/Tulips.jfif" },
  { name: "Rose Love Bouquet", category: "bouquet", price: 55, stock: "in", image: "images/roses.jpg" },
  { name: "Sunflower Bouquet", category: "bouquet", price: 30, stock: "out", image: "images/sunflower.jpg" },
  { name: "Rose Basket", category: "basket", price: 70, stock: "in", image: "images/garden.jpg" },
  { name: "Flower Box", category: "box", price: 50, stock: "in", image: "images/lillies.jpg" }
];

// RENDER
function renderProducts() {
  const grid = document.getElementById("productGrid");
  grid.innerHTML = "";

  products.forEach(product => {
    const card = document.createElement("div");
    card.classList.add("product-card");

    card.dataset.category = product.category;
    card.dataset.price = product.price;
    card.dataset.stock = product.stock;

    card.onclick = function() { openModal(this); };

    card.innerHTML = `
      <div class="product-image">
        <img src="${product.image}">
      </div>

      <div class="product-info">
        <h3>${product.name}</h3>
        <p>Beautiful fresh flowers</p>
        <span class="price">$${product.price}</span>

        <button onclick="event.stopPropagation(); addToCart(this)" class="add-btn">
          🛒 Add
        </button>
      </div>
    `;

    grid.appendChild(card);
  });
}

// FILTER
function filterProducts() {
  const cards = document.querySelectorAll(".product-card");

  const selectedCategories = Array.from(document.querySelectorAll(".category-filter:checked")).map(cb => cb.value);
  const selectedStock = Array.from(document.querySelectorAll(".stock-filter:checked")).map(cb => cb.value);

  const maxPrice = document.getElementById("priceRange").value;
  document.getElementById("priceValue").innerText = maxPrice;

  cards.forEach(card => {
    const category = card.dataset.category;
    const price = parseFloat(card.dataset.price);
    const stock = card.dataset.stock;

    let show = true;

    if (selectedCategories.length && !selectedCategories.includes(category)) show = false;
    if (selectedStock.length && !selectedStock.includes(stock)) show = false;
    if (price > maxPrice) show = false;

    card.style.display = show ? "block" : "none";
  });

  updateCounts();
}

// COUNTS
function updateCounts() {
  const cards = document.querySelectorAll(".product-card");
  const counts = {};

  cards.forEach(card => {
    if (card.style.display !== "none") {
      const cat = card.dataset.category;
      counts[cat] = (counts[cat] || 0) + 1;
    }
  });

  document.querySelectorAll(".count").forEach(el => {
    el.innerText = counts[el.dataset.category] || 0;
  });
}

// MODAL
function openModal(el) {
  const img = el.querySelector("img").src;
  const title = el.querySelector("h3").innerText;
  const price = el.querySelector(".price").innerText;
  const desc = el.querySelector("p").innerText;

  document.getElementById("modalImg").src = img;
  document.getElementById("modalTitle").innerText = title;
  document.querySelector(".modal-price").innerText = price;
  document.querySelector(".modal-desc").innerText = desc;

  document.getElementById("productModal").style.display = "flex";
}

function closeModal() {
  document.getElementById("productModal").style.display = "none";
}

// CART //
let count = 0;

function addToCart(el) {
  count++;

  // desktop cart
  document.getElementById("cart-count").innerText = count;

  // mobile cart
  const mobileCount = document.getElementById("mobile-cart-count");
  if (mobileCount) {
    mobileCount.innerText = count;
  }

  const title = document.getElementById("modalTitle")?.innerText || "Item";
  alert(title + " added to cart 🛒");
}


// LOAD
window.onload = function() {
  renderProducts();
  filterProducts();
};

</script>

<script>
document.querySelectorAll(".filter-group h4").forEach(header => {
  header.addEventListener("click", () => {
    header.parentElement.classList.toggle("active");
  });
});
</script>

<script>
// 🔍 OPEN SEARCH (for ALL search buttons)
document.querySelectorAll(".open-search").forEach(btn => {
  btn.addEventListener("click", (e) => {
    e.preventDefault();
    document.getElementById("searchOverlay").classList.add("active");
  });
});

// ❌ CLOSE SEARCH
function closeSearch() {
  document.getElementById("searchOverlay").classList.remove("active");
}

// ✨ ACTIVE TAB SWITCH
document.querySelectorAll(".mobile-nav a").forEach(link => {
  link.addEventListener("click", () => {
    document.querySelectorAll(".mobile-nav a").forEach(l => l.classList.remove("active"));
    link.classList.add("active");
  });
});
</script>

<script>
let lastScroll = 0;
const filterBar = document.querySelector(".filters");

window.addEventListener("scroll", () => {
  let currentScroll = window.pageYOffset;

  if (currentScroll > lastScroll && currentScroll > 50) {
    // scrolling DOWN
    filterBar.classList.add("hide");
  } else {
    // scrolling UP
    filterBar.classList.remove("hide");
  }

  lastScroll = currentScroll;
});
</script>


<!-- 📱 MOBILE BOTTOM NAV -->
<div class="mobile-nav">
  <a href="#"><i class="fas fa-home"></i><span>Home</span></a>
  <a href="#" class="open-search">
  <i class="fas fa-search"></i>
  <span>Search</span>
  </a>
  <a href="#"><i class="fas fa-heart"></i><span>Wishlist</span></a>
  <a href="#">
    <i class="fas fa-shopping-bag"></i>
    <span>Cart</span>
    <small id="mobile-cart-count">0</small>
  </a>
</div>



<div class="search-overlay" id="searchOverlay">
  <span class="search-close" onclick="closeSearch()">✕</span>
  <input type="text" placeholder="Search flowers...">
</div>

</body>
</html>
